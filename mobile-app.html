<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mobile App E-Learning Final Year Project by Amir Aizad featuring interactive course interfaces and mobile UI design.">
    <title>Mobile App E-Learning | Amir Aizad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="index.html" class="back-link">
        <span>←</span> Back to Home
    </a>

    <main class="section section-pt-100">
        <div class="container">
            <div class="stat-grid">
                <div class="stat-item">
                    <h4>Tools</h4>
                    <p>Adobe Animate CC, Audacity</p>
                </div>
            </div>
        </div>

        <div class="gallery-header">
            <h3 class="gallery-title">
                Visual Showcase
            </h3>
        </div>

        <div class="gallery-grid landscape">
            <!-- Featured Screen -->
            <div class="featured-frame">
                <div class="android-frame landscape">
                    <div class="android-camera"></div>
                    <div class="android-screen">
                        <img src="images/image (4).png" alt="E-Learning Mobile App - Main Course Interface"
                            loading="lazy" decoding="async">
                    </div>
                </div>
            </div>

            <!-- Screen 1 -->
            <div class="android-frame landscape">
                <div class="android-camera"></div>
                <div class="android-screen">
                    <img src="images/image (3).png" alt="E-Learning App - Account and Progress View" loading="lazy" decoding="async">
                </div>
            </div>

            <!-- Screen 2 -->
            <div class="android-frame landscape">
                <div class="android-camera"></div>
                <div class="android-screen">
                    <img src="images/image (2).png" alt="E-Learning App - Course Video Player" loading="lazy" decoding="async">
                </div>
            </div>

            <!-- Screen 3 -->
            <div class="android-frame landscape">
                <div class="android-camera"></div>
                <div class="android-screen">
                    <img src="images/image (1).png" alt="E-Learning App - Category Sidebar" loading="lazy" decoding="async">
                </div>
            </div>

            <!-- Screen 4 -->
            <div class="android-frame landscape">
                <div class="android-camera"></div>
                <div class="android-screen">
                    <img src="images/image.png" alt="E-Learning App - Main Dashboard" loading="lazy" decoding="async" width="800"
                        height="514">
                </div>
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close modal">&times;</button>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Amir Aizad. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');

        const openLightbox = (img) => {
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightbox.classList.add('active');
            lightbox.setAttribute('aria-hidden', 'false');
        };

        const closeLightbox = () => {
            lightbox.classList.remove('active');
            lightbox.setAttribute('aria-hidden', 'true');
        };

        document.querySelectorAll('.android-screen img').forEach(img => {
            img.addEventListener('click', () => openLightbox(img));
        });

        lightboxClose.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>

</html>
