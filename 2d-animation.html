<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2D Animation Portfolio Showcase by Amir Aizad featuring character animation and motion design created with Adobe Animate.">
    <title>2D Animation | Amir Aizad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"

</head>

<body>
    <a href="index.html" class="back-link">
        <span>←</span> Back to Home
    </a>

    <main class="section section-pt-100">
        <div class="container">
            <div class="stat-grid">
                <div class="stat-item">
                    <h4>Tools</h4>
                    <p>Adobe Animate</p>
                </div>
            </div>
        </div>

        <div class="gallery-header">
            <h3 class="gallery-title">

            </h3>
        </div>

        <div class="gallery-grid landscape">
            <!-- Animation Work Video -->
            <div class="featured-frame">
                <div class="android-frame landscape">
                    <div class="android-camera"></div>
                    <div class="android-screen">
                        <video controls preload="metadata" style="width: 100%; height: 100%; object-fit: cover;">
                            <source src="videos/2D.mp4" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>
            </div>
        </div>
